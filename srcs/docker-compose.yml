
services:
  mariadb:
    container_name: mariadb
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    image: mariadb:${D_IMAGE_TAG}
    env_file:
      - .env
    volumes:
      - DB:/var/lib/mysql
    expose:
      - "3306"
    networks:
      - ${D_NETWORK_NAME}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$(cat /run/secrets/db_root_password)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
    secrets:
      - db_root_password
      - db_user_password
  
  redis:
    container_name: redis
    build:
      context: ./requirements/bonus/redis
      dockerfile: Dockerfile
    image: redis:${D_IMAGE_TAG}
    volumes:
      - redis_data:/var/lib/redis
    expose:
      - "6379"
    networks:
      - ${D_NETWORK_NAME}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $(cat /run/secrets/redis_password) ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    secrets:
      - redis_password

  wordpress:
    container_name: wordpress
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    image: wordpress:${D_IMAGE_TAG}
    env_file:
      - .env
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - WordPress:/var/www/html
    expose:
      - "9000"
    networks:
      - ${D_NETWORK_NAME}
    restart: unless-stopped
    secrets:
      - db_user_password
      - wp_admin_password
      - wp_editor_password
      - redis_password

  vsftpd:
    container_name: vsftpd
    build:
      context: ./requirements/bonus/vsftpd
      dockerfile: Dockerfile
    image: vsftpd:${D_IMAGE_TAG}
    env_file:
      - .env
    depends_on:
      - wordpress
    volumes:
      - WordPress:/var/www/html
    ports:
      - "21:21"
      - "21000-21010:21000-21010"
    networks:
      - ${D_NETWORK_NAME}
    restart: unless-stopped
    secrets:
      - vsftpd_password

  adminer:
    container_name: adminer
    build:
      context: ./requirements/bonus/adminer
      dockerfile: Dockerfile
    image: adminer:${D_IMAGE_TAG}
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - adminer_data:/var/www/adminer
    expose:
      - "9001"
    networks:
      - ${D_NETWORK_NAME}
    restart: unless-stopped

  cadvisor:
    container_name: cadvisor
    build:
      context: ./requirements/bonus/cadvisor
      dockerfile: Dockerfile
    image: cadvisor:${D_IMAGE_TAG}
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    expose:
      - "8080"
    networks:
      - ${D_NETWORK_NAME}
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg

  nginx:
      container_name: nginx
      build:
        context: ./requirements/nginx
        dockerfile: Dockerfile
      image: nginx:${D_IMAGE_TAG}
      ports:
        - "443:443"
      depends_on:
        wordpress:
          condition: service_started
        adminer:
          condition: service_started
        cadvisor:
          condition: service_started
      volumes:
        - WordPress:/var/www/html
        - adminer_data:/var/www/adminer
      networks:
        - ${D_NETWORK_NAME}
      restart: unless-stopped
      secrets:
        - inception_crt
        - inception_key

volumes:
  DB:
    name: DB
    driver: local
    driver_opts:
      type: none
      device: ${HOME}/data/DB
      o: bind
  WordPress:
    name: WordPress
    driver: local
    driver_opts:
      type: none
      device: ${HOME}/data/WordPress
      o: bind
  redis_data:
    driver: local
  adminer_data:
    driver: local

networks:
  inception_net:
    name: ${D_NETWORK_NAME}
    driver: bridge

# *_password.txt must contain characters from base64 charset only
secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_user_password:
    file: ../secrets/db_user_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_editor_password:
    file: ../secrets/wp_editor_password.txt
  redis_password:
    file: ../secrets/redis_password.txt
  vsftpd_password:
    file: ../secrets/vsftpd_password.txt
  inception_crt:
    file: ../secrets/inception.crt
  inception_key:
    file: ../secrets/inception.key
