listen=YES
listen_ipv6=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
dirmessage_enable=YES
use_localtime=YES
xferlog_enable=YES
connect_from_port_20=YES

# セキュリティ設定
chroot_local_user=YES
allow_writeable_chroot=YES
secure_chroot_dir=/var/run/vsftpd/empty

# パッシブモード設定
pasv_enable=YES
pasv_min_port=21000
pasv_max_port=21010

# ユーザー制限
userlist_enable=YES
userlist_file=/etc/vsftpd.userlist
userlist_deny=NO

# PAM認証
pam_service_name=vsftpd

# フォアグラウンド実行（Dockerコンテナ用）
background=NO

# ログ設定
xferlog_std_format=NO
log_ftp_protocol=YES
syslog_enable=NO
vsftpd_log_file=/var/log/vsftpd/vsftpd.log

# タイムアウト設定
idle_session_timeout=600
data_connection_timeout=120

# 追加の安定性設定
tcp_wrappers=NO