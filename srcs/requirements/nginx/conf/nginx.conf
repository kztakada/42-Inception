server {
	listen 80;
    server_name katakada.42.fr;
    # server_name localhost;

    # HTTPSへのリダイレクト(恒久的移動)
    return 301 https://$host$request_uri;
}

# cAdvisor用のサブドメイン
server {
    listen 80;
    server_name cadvisor.katakada.42.fr;
     # HTTPSへのリダイレクト(恒久的移動)
    return 301 https://$host$request_uri;
}

# Portainer用のHTTPリダイレクト
server {
    listen 80;
    server_name portainer.katakada.42.fr;
    # HTTPSへのリダイレクト(恒久的移動)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name katakada.42.fr;
	# server_name localhost;

    # 自己署名証明書と秘密鍵のパス、TLS指定
    ssl_certificate /run/secrets/inception_crt;
    ssl_certificate_key /run/secrets/inception_key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # root指定
    root /var/www/html;
    # 読み込み優先順位
    index index.php index.html index.htm;

    # リクエスト時のリトライ挙動(フルパス → 末尾に/ → どちらも失敗404)
    location / {
        try_files $uri $uri/ =404;
    }

    # WordPressへのルーティング ----
    # .phpで終わるアクセス(正規表現)へのリクエストをFastCGI経由で処理する
    location ~ \.php$ {
        include fastcgi_params; # FastCGIパラメータのインクルード
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name; #パスの置き換え
        fastcgi_index index.php; # ディレクトリアクセス時のデフォルトPHPファイル(フォールバック用)
        fastcgi_pass wordpress:9000; # PHP-FPMが待機しているWordPressコンテナに転送させる
    }

    # Adminerへのルーティング ----
    location /adminer {
        alias /var/www/adminer;
        index index.php;
        
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/adminer/index.php;
            fastcgi_pass adminer:9001; # PHP-FPMが待機しているAdminerコンテナに転送させる
        }
    }

    # 静的サイト（fruits）へのルーティング ----
    location /fruits {
        alias /var/www/fruits;
        index index.html;
        try_files $uri $uri/ /fruits/index.html;

        # 画像やCSSなどの静的ファイルのキャッシュ設定
        location ~* \\.(jpg|jpeg|png|gif|ico|css|js)$ {
            expires 1d; # 1日間キャッシュ
            add_header Cache-Control "public, immutable"; # 有効期限内であればリクエストなしでキャッシュを使用可
        }
    }

}

# cAdvisor専用サーバーブロック
server {
    listen 443 ssl;
    server_name cadvisor.katakada.42.fr;

    ssl_certificate /run/secrets/inception_crt;
    ssl_certificate_key /run/secrets/inception_key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # cAdvisorへのプロキシ設定
    location / {
        proxy_pass http://cadvisor:8080; #全てのリクエストをcAdvisorコンテナに転送
        proxy_set_header Host $host; # ホストヘッダー変更なし
        proxy_set_header X-Real-IP $remote_addr; # クライアントの実IPアドレスを転送
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # リクエストが通過した全プロキシチェーンの情報を追加
        proxy_set_header X-Forwarded-Proto $scheme; # リクエストが元々使用していたプロトコル情報を転送
        
        # WebSocket対応
        proxy_http_version 1.1; # HTTP/1.1を使用
        proxy_set_header Upgrade $http_upgrade; # クライアントがWebSocketへのアップグレードを要求している場合に対応
        proxy_set_header Connection "upgrade"; # プロトコルアップグレードを可能にするためのヘッダー設定
        
        # タイムアウト設定
        proxy_connect_timeout 60s; # 接続タイムアウト
        proxy_send_timeout 60s; # 送信タイムアウト
        proxy_read_timeout 60s; # 受信タイムアウト
    }
}

# Portainer専用サーバーブロック
server {
    listen 443 ssl;
    server_name portainer.katakada.42.fr;

    ssl_certificate /run/secrets/inception_crt;
    ssl_certificate_key /run/secrets/inception_key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass https://portainer:9443;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket対応
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # SSL検証を無効化（自己署名証明書のため）
        proxy_ssl_verify off;
        
        # タイムアウト設定
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
