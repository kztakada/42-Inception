server {
	listen 80;
    server_name katakada.42.fr;
    # server_name localhost;

    # HTTPSへのリダイレクト
    return 301 https://$host$request_uri;
}

# cAdvisor用のサブドメイン
server {
    listen 80;
    server_name cadvisor.katakada.42.fr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name katakada.42.fr;
	# server_name localhost;

    # 自己署名証明書と秘密鍵のパス、TLS指定
    ssl_certificate /run/secrets/inception_crt;
    ssl_certificate_key /run/secrets/inception_key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # root指定
    root /var/www/html;
    # 優先的に読み込む順番
    index index.php index.html index.htm;

    # WordPressへのルーティング（既存）----
    # 静的ファイルへのアクセス(存在しないなら404)
    location / {
        try_files $uri $uri/ =404;
    }

    # PHPファイルへのリクエストをFastCGI経由で処理する
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
        fastcgi_index index.php; # ディレクトリアクセス時のデフォルトPHPファイル
        fastcgi_pass wordpress:9000; # PHP-FPMが待機しているWordPressコンテナに転送させる
    }

    # Adminerへのルーティング（新規追加）----
    location /adminer {
        alias /var/www/adminer;
        index index.php;
        
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/adminer/index.php;
            fastcgi_pass adminer:9001;
        }
    }

    # 静的サイト（fruits）へのルーティング（新規追加）----
    location /fruits {
        alias /var/www/fruits;
        index index.html;
        try_files $uri $uri/ /fruits/index.html;

        # 画像やCSSなどの静的ファイルのキャッシュ設定
        location ~* \\.(jpg|jpeg|png|gif|ico|css|js)$ {
            expires 1d;
            add_header Cache-Control "public, immutable";
        }
    }

}

# cAdvisor専用サーバーブロック
server {
    listen 443 ssl;
    server_name cadvisor.katakada.42.fr;

    ssl_certificate /run/secrets/inception_crt;
    ssl_certificate_key /run/secrets/inception_key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://cadvisor:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket対応
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # タイムアウト設定
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}